name: Publish CLI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Select next release version
        id: version
        run: node scripts/npm-version.mjs
      - name: Pack and inspect public artifact
        if: steps.version.outputs.skip != 'true'
        run: |
          npm pack --json > pack.json
          node scripts/check-package.mjs pack.json
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
