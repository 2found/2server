name: Publish CLI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - run: bun install --frozen-lockfile
      - name: Install encrypted-backup test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Typecheck and tests including isolated Docker integration
        run: DOCKER_TESTS=1 TERRAFORM_TESTS=1 bun run check
      - name: Terraform formatting and mocked providers
        run: |
          terraform fmt -check -recursive terraform
          scripts/test-terraform.sh
      - name: Documentation and installed package
        run: |
          node scripts/check-docs.mjs
          npm pack --json > pack.json
          node scripts/check-package.mjs pack.json
          node scripts/smoke-package.mjs "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')"
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Select next release version
        id: version
        run: node scripts/npm-version.mjs
      - name: Pack and verify exact release artifact
        if: steps.version.outputs.skip != 'true'
        run: |
          npm pack --json > pack.json
          node scripts/check-package.mjs pack.json
          node scripts/smoke-package.mjs "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')"
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: npm-release-${{ github.sha }}
          path: |
            *.tgz
            pack.json
          retention-days: 30
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
