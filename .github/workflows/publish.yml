name: Publish CLI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to resume (for example v0.1.0)
        required: true
        type: string
# GITHUB_TOKEN-created tags do not trigger workflows. Distribution is a
# dependent job in THIS run; a human tag uses exactly the same pipeline.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - run: node --test scripts/release-plan.test.mjs scripts/release-assets.test.mjs
      - run: bun install --frozen-lockfile
      - name: Install encrypted-backup test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Typecheck and tests including isolated Docker integration
        run: DOCKER_TESTS=1 TERRAFORM_TESTS=1 bun run check
      - name: Terraform formatting and mocked providers
        run: |
          terraform fmt -check -recursive terraform
          scripts/test-terraform.sh
      - name: Documentation and installed package
        run: |
          node scripts/check-docs.mjs
          npm pack --json > pack.json
          node scripts/check-package.mjs pack.json
          node scripts/smoke-package.mjs "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-cli-${{ github.run_id }}
          path: |
            *.tgz
            pack.json
          if-no-files-found: error
          overwrite: true
  plan:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      release: ${{ steps.plan.outputs.release }}
      createTag: ${{ steps.plan.outputs.createTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-plan.test.mjs scripts/release-assets.test.mjs
      - id: plan
        run: node scripts/release-plan.mjs
        env:
          RELEASE_REF_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'tag' || github.ref_type }}
          RELEASE_REF_NAME: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
  tag:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - name: Create immutable release tag after verification
        if: needs.plan.outputs.createTag == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
  distribute:
    needs: [plan, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: verified-cli-${{ github.run_id }}
      - name: Verify source version against npm
        id: npm-version
        run: node scripts/npm-version.mjs
      - name: Reuse the packed and smoke-tested artifact
        run: |
          mkdir -p dist
          cp "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')" dist/
      - name: Generate versioned documentation and download index
        run: node scripts/release-assets.mjs "$VERSION" dist
      - name: Stage GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-plan has already rejected published versions. Only drafts
          # can be resumed; never overwrite assets on a published release.
          if gh release view "v$VERSION" --json isDraft > release-state.json 2> release-error.txt; then
            test "$(jq -r .isDraft release-state.json)" = true
          elif grep -q 'release not found' release-error.txt; then
            gh release create "v$VERSION" --verify-tag --draft --generate-notes --title "v$VERSION"
          else
            cat release-error.txt >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" --jq .body > dist/NOTES.md
          cat dist/DOWNLOADS.md >> dist/NOTES.md
          gh release edit "v$VERSION" --notes-file dist/NOTES.md
          gh release upload "v$VERSION" dist/*.tar.gz dist/*.tgz dist/release.json dist/DOWNLOADS.md dist/checksums.txt --clobber
      - name: Publish exact npm artifact with provenance
        if: steps.npm-version.outputs.skip != 'true'
        run: npm publish "$(node -p 'JSON.parse(require("fs").readFileSync("pack.json"))[0].filename')" --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --latest
      - name: Notify website release consumer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Website consumes published releases hourly; configure WEBSITE_DISPATCH_TOKEN for immediate refresh.'
            exit 0
          fi
          gh api --method POST repos/2found/2found.dev/dispatches -f event_type=release-published
