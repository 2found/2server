apiVersion: 2server.app/v1
kind: ExtensionDefinition
metadata: {name: cliproxy}
order: 30
hook: cliproxy
template:
  clientKeyEnv: [CLIPROXY_CLIENT_KEY]
  managementKeyEnv: CLIPROXY_MANAGEMENT_KEY
commands:
  accounts: {description: 'List provider accounts, their state, throughput and active cooldowns (never tokens)', readOnly: true}
  models: {description: 'List the model IDs clients can request, aliases included', readOnly: true}
  quota: {description: 'Query live remaining upstream quota and cooldown windows ([ACCOUNT])', usage: '[ACCOUNT]', readOnly: true}
  reset-quota: {description: 'Clear active quota cooldown latches on an account or --all', usage: 'ACCOUNT|--all [--apply]'}
  login: {description: 'Sign in a provider account; opens the browser flow from this machine', usage: 'codex|antigravity|claude|xai|kimi [--apply]'}
  import: {description: 'Upload a provider auth JSON from a private file', usage: '--file PRIVATE_FILE [--apply]'}
  priority: {description: 'Set the order accounts are tried in; higher is used first, 0 by default', usage: 'ACCOUNT PRIORITY [--apply]'}
  disable: {description: 'Stop routing to an account without deleting it', usage: 'ACCOUNT [--apply]'}
  enable: {description: 'Route to a disabled account again', usage: 'ACCOUNT [--apply]'}
  remove: {description: 'Delete an account and its tokens', usage: 'ACCOUNT [--apply]'}
outputs:
  endpoint: {type: endpoint, protocol: http, port: 8317}
schema:
  type: object
  properties:
    image: {default: 'eceasy/cli-proxy-api:v8.0.29', type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/:@-]+$'}
    # Client API keys (the Authorization bearer apps send). One VM secret per
    # consumer, so a leaked key is rotated without touching the others.
    clientKeyEnv:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}
    managementKeyEnv: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}
    # Client-visible model names. The same alias on several channels pools
    # their accounts: a failed account is retried on the next one. Requests
    # go to the highest-priority ready accounts (`app NAME priority`).
    models:
      type: array
      default: []
      maxItems: 256
      items:
        type: object
        properties:
          alias: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/()+-]{0,127}$'}
          channel: {type: string, enum: [antigravity, codex, claude, xai, kimi, vertex, aistudio, meta]}
          name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/()+-]{0,127}$'}
          # Keep the upstream name requestable next to the alias.
          fork: {type: boolean, default: false}
        required: [alias, channel, name]
        additionalProperties: false
    # Upstream models hidden from clients; `*` wildcards are allowed.
    excludedModels:
      type: array
      default: []
      maxItems: 256
      items:
        type: object
        properties:
          channel: {type: string, enum: [antigravity, codex, claude, xai, kimi, vertex, aistudio, meta]}
          pattern: {type: string, pattern: '^[A-Za-z0-9*][A-Za-z0-9._:/()+*-]{0,127}$'}
        required: [channel, pattern]
        additionalProperties: false
    # OpenAI-compatible upstreams reached by API key (OpenCode Zen/Go,
    # OpenRouter...). Their models are requested by `alias` (or by `name` when
    # no alias is given); the key is a VM secret, never written to the spec.
    openaiProviders:
      type: array
      default: []
      maxItems: 16
      items:
        type: object
        properties:
          name: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$'}
          baseUrl: {type: string, pattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'}
          apiKeyEnv: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}
          # Static request headers the upstream requires (OpenCode Go routes on x-opencode-session).
          headers:
            type: object
            default: {}
            additionalProperties: {type: string, pattern: '^[\x21-\x7e]([\x20-\x7e]*[\x21-\x7e])?$', maxLength: 256}
            propertyNames: {pattern: '^[A-Za-z0-9-]{1,64}$'}
          models:
            type: array
            minItems: 1
            maxItems: 128
            items:
              type: object
              properties:
                name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/()+-]{0,127}$'}
                alias: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/()+-]{0,127}$'}
              required: [name]
              additionalProperties: false
        required: [name, baseUrl, apiKeyEnv, models]
        additionalProperties: false
    # Request fields the gateway always sets for matching models (CLIProxyAPI
    # `payload.override`), e.g. `thinking.type: disabled` for a reasoning model
    # whose clients cannot send that field. `params` keys are gjson/sjson paths.
    payloadOverrides:
      type: array
      default: []
      maxItems: 32
      items:
        type: object
        properties:
          models:
            type: array
            minItems: 1
            maxItems: 16
            items:
              type: object
              properties:
                name: {type: string, pattern: '^[A-Za-z0-9*][A-Za-z0-9._:/()+*-]{0,127}$'}
                protocol: {type: string, enum: [openai, gemini, claude, codex, antigravity]}
              required: [name]
              additionalProperties: false
          params:
            type: object
            minProperties: 1
            additionalProperties: {type: [string, number, boolean]}
            propertyNames: {pattern: '^[A-Za-z0-9_.#-]{1,128}$'}
        required: [models, params]
        additionalProperties: false
    # Spend Google AI credits when an antigravity account's quota is used up.
    antigravityCredits: {default: false, type: boolean}
    routing:
      default: round-robin
      type: string
      enum: [round-robin, fill-first]
    requestRetry: {default: 3, type: integer, minimum: 0, maximum: 10}
    maxRetryIntervalSeconds: {default: 30, type: integer, minimum: 0, maximum: 300}
    # SSE comment lines while a stream is idle, so a reasoning model that thinks
    # longer than a proxy's idle timeout (Cloudflare: 100s) keeps its connection.
    streamKeepaliveSeconds: {default: 15, type: integer, minimum: 0, maximum: 90}
    # Retry a stream on another account when it fails before its first byte
    # reaches the client (401/403/408/429/5xx). Nothing already sent is replayed.
    streamBootstrapRetries: {default: 1, type: integer, minimum: 0, maximum: 3}
    # Larger request bodies answer 413 instead of filling the memory limit.
    maxRequestBodyMb: {default: 32, type: integer, minimum: 1, maximum: 512}
    memoryMb: {default: 256, type: integer, minimum: 96, maximum: 8192}
    cpus: {default: 0.5, type: number, exclusiveMinimum: 0, maximum: 16}
    dataPath: {default: /opt/2server/data/cliproxy, type: string, pattern: '^(?!.*\.\.)/[a-zA-Z0-9_./-]*$'}
  required: [clientKeyEnv, managementKeyEnv]
  additionalProperties: false
immutable: [dataPath]
dataPathField: dataPath
service:
  # A Go binary with no shell work at runtime: unprivileged, read-only root,
  # no capabilities. Accounts live in the data volume; config is a private
  # release file.
  user: '65532:65532'
  read_only: true
  cap_drop: [ALL]
  tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777']
  command: [/CLIProxyAPI/CLIProxyAPI, -config, /run/secrets/config.yaml]
  volumes:
  - {$value: spec.dataPath, suffix: ':/data'}
  - ./config.yaml:/run/secrets/config.yaml:ro
  # The image has no curl or wget. Bash's /dev/tcp reads /healthz (no auth,
  # never logged) without starting another program.
  healthcheck:
    test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8317 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && IFS= read -r l <&3 && [[ $l == *" 200 "* ]]']
    interval: 30s
    timeout: 4s
    retries: 4
    start_period: 60s
    start_interval: 2s
