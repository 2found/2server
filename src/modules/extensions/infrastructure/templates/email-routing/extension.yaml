apiVersion: 2server.app/v1
kind: ExtensionDefinition
metadata: {name: email-routing, key: emailRouting}
order: 90
runtime:
  engine: email-routing
  defaults:
    zone: example.com
    routes:
      - address: contact@example.com
        destination: owner@example.net
template:
  zone: example.com
  routes:
    - address: contact@example.com
      destination: owner@example.net
