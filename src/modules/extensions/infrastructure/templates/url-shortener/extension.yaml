apiVersion: 2server.app/v1
kind: ExtensionDefinition
metadata: {name: url-shortener, key: urlShortener}
order: 80
runtime:
  engine: worker
  defaults:
    # Not all digits: a YAML writer may emit a numeric-looking string unquoted,
    # and the value must survive `init` → `deploy` as a string.
    accountId: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
    worker: app
    hostname: go.example.com
    zone: example.com
    database: app-links
commands:
  customers: {description: Register a customer Ed25519 pubkey, usage: '--id ID --public KEY [--apply]'}
template:
  accountId: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  worker: app
  hostname: go.example.com
  zone: example.com
  database: app-links
