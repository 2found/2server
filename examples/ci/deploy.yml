# Copy into the consuming repo; its manifest is the deployment contract.
# Build and migrations belong before the final step in the app release pipeline.
name: Deploy source config
on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to reviewed App/Extension/Domain YAML
        required: true
      image:
        description: Optional app image override (prefer the build digest)
        required: false
permissions:
  contents: read
concurrency:
  group: two-server-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, 2server]
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: 2server
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TWO_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TWO_SERVER_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Apply selected file
        env:
          CONFIG_FILE: ${{ inputs.config }}
          IMAGE: ${{ inputs.image }}
          TWO_SERVER_SSH: ${{ vars.TWO_SERVER_SSH }}
        run: |
          args=(apply -f "$CONFIG_FILE" --ssh "$TWO_SERVER_SSH" --apply)
          if [ -n "$IMAGE" ]; then args+=(--image "$IMAGE"); fi
          bun 2server/src/cli.ts "${args[@]}"
