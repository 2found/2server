# Copy into .github/workflows/ after configuring the environment and manifest.
# Standalone checkout paths shown; use working-directory: 2server for a submodule.
# Consumers using a submodule must enable recursive checkout.
# The dedicated runner retains private certificate state.
# This generic example uses plain SSH; GCP IAP requires gcloud + workload identity.
name: 2server
on:
  workflow_dispatch:
    inputs:
      deploy_apps:
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1' # reconcile domains and renew origin certs before expiry
permissions:
  contents: read
concurrency:
  group: two-server-production
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: [self-hosted, linux, 2server]
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      # A dedicated runner keeps ~/.local/state/2server encrypted at rest.
      # Never export that private certificate state as a public CI artifact.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TWO_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TWO_SERVER_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - run: bun install --frozen-lockfile && bun run check
        working-directory: .
      - name: Deploy selected immutable images
        if: inputs.deploy_apps
        run: bun src/cli.ts deploy examples/production.json --apply
        working-directory: .
        # Add app-specific secret environment references here.
      - name: Reconcile domains and certificates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun src/cli.ts domains examples/production.json --apply
        working-directory: .
